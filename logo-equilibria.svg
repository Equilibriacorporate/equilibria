    <circle cx="190" cy="130" r="9" fill="#FFFFFF"/>
    <path d="M90 130h96" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".92"/>
  </g>

  <g>
    <text x="286" y="124" fill="url(#word)" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">Equilibria</text>
    <path d="M288 144h286" stroke="#3F7F68" stroke-width="4" stroke-linecap="round"/>
    <text x="288" y="178" fill="#6F7E79" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">gestão emocional corporativa</text>
    <text x="288" y="207" fill="#8A7770" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">clareza para cuidar, dados para prevenir</text>
