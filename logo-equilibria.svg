    <path fill="#F8FAF7" d="M78 151c28-20 50-25 73-21 22 4 41 16 64 36-29 18-58 23-85 15-23-7-39-19-52-30Z" opacity=".92"/>
    <path fill="#23312F" d="M72 130c20-31 47-47 79-47 26 0 49 11 69 32-5-43-40-76-82-76-50 0-91 41-91 91 0 35 20 65 49 80-19-22-29-48-24-80Z" opacity=".16"/>

