      <stop offset=".48" stop-color="#3F7F68"/>
      <stop offset="1" stop-color="#C0915F"/>
    </linearGradient>
    <linearGradient id="word" x1="300" x2="665" y1="80" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21312E"/>
      <stop offset="1" stop-color="#3F6157"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1F3430" flood-opacity=".14"/>
