<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title desc">
  <title id="title">Equilibria</title>
  <desc id="desc">Logo Equilibria com monograma E, eixo de equilíbrio e formas de cuidado corporativo.</desc>
  <defs>
