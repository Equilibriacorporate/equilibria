services:
  - type: web
    name: equilibria
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: "npm start"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_TTL_MS
        value: 28800000
      - key: MIN_TEAM_SAMPLE
        value: 3
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_MS
        value: 18000
      - key: PLATFORM_ADMIN_NAME
        value: Admin Equilibria
      - key: PLATFORM_ADMIN_EMAIL
        value: ""
      - key: PLATFORM_ADMIN_PASSWORD
        value: ""
    disk:
      name: equilibria-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
